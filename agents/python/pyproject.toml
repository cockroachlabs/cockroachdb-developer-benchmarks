[project]
name = "cockroachdb-benchmark-agent-python"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "psutil>=6.0.0",
    "numpy>=2.0.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
