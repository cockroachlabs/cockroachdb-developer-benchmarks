services:
  crdb-1:
    image: cockroachdb/cockroach:latest-v26.3
    command: start --insecure --advertise-addr=crdb-1 --join=crdb-1,crdb-2,crdb-3
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - crdb-cluster-1:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - bench-net

  crdb-2:
    image: cockroachdb/cockroach:latest-v26.3
    command: start --insecure --advertise-addr=crdb-2 --join=crdb-1,crdb-2,crdb-3
    ports:
      - "26258:26257"
      - "8081:8080"
    volumes:
      - crdb-cluster-2:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - bench-net

  crdb-3:
    image: cockroachdb/cockroach:latest-v26.3
    command: start --insecure --advertise-addr=crdb-3 --join=crdb-1,crdb-2,crdb-3
    ports:
      - "26259:26257"
      - "8082:8080"
    volumes:
      - crdb-cluster-3:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - bench-net

  crdb-init:
    image: cockroachdb/cockroach:latest-v26.3
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /cockroach/cockroach init --insecure --host=crdb-1 2>/dev/null;
      /cockroach/cockroach sql --insecure --host=crdb-1 -f /init.sql
    depends_on:
      crdb-1:
        condition: service_healthy
      crdb-2:
        condition: service_healthy
      crdb-3:
        condition: service_healthy
    volumes:
      - ./init.sql:/init.sql:ro
    networks:
      - bench-net
    restart: "no"

volumes:
  crdb-cluster-1:
  crdb-cluster-2:
  crdb-cluster-3:

networks:
  bench-net:
    driver: bridge
