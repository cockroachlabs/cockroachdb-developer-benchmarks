  crdb-9:
    image: cockroachdb/cockroach:latest-v26.3
    command: >
      start --insecure
      --advertise-addr=crdb-9
      --join=crdb-1,crdb-4,crdb-7
      --locality=region=eu-west,zone=eu-west-3
    ports:
      - "26265:26257"
      - "8088:8080"
    volumes:
      - crdb-multi-9:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      bench-net:
      region-eu-west:
    cap_add:
      - NET_ADMIN

  crdb-init:
    image: cockroachdb/cockroach:latest-v26.3
    entrypoint: ["/bin/sh", "-c"]
    command: >
      /cockroach/cockroach init --insecure --host=crdb-1 2>/dev/null;
      sleep 5;
      /cockroach/cockroach sql --insecure --host=crdb-1 -f /init.sql;
      /cockroach/cockroach sql --insecure --host=crdb-1 -e "
        ALTER DATABASE benchmark PRIMARY REGION 'us-east';
        ALTER DATABASE benchmark ADD REGION 'us-west';
        ALTER DATABASE benchmark ADD REGION 'eu-west';
        ALTER DATABASE benchmark SURVIVE REGION FAILURE;
      "
    depends_on:
      crdb-1:
        condition: service_healthy
      crdb-4:
        condition: service_healthy
      crdb-7:
        condition: service_healthy
    volumes:
      - ./init.sql:/init.sql:ro
    networks:
      - bench-net
    restart: "no"

volumes:
  crdb-multi-1:
  crdb-multi-2:
  crdb-multi-3:
  crdb-multi-4:
  crdb-multi-5:
  crdb-multi-6:
  crdb-multi-7:
  crdb-multi-8:
  crdb-multi-9:

networks:
  bench-net:
    driver: bridge
  region-us-east:
    driver: bridge
  region-us-west:
    driver: bridge
  region-eu-west:
    driver: bridge
