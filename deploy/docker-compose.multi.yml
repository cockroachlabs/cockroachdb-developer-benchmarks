services:
  # Region: US-EAST (nodes 1-3)
  crdb-1:
    image: cockroachdb/cockroach:latest-v26.3
    command: >
      start --insecure
      --advertise-addr=crdb-1
      --join=crdb-1,crdb-4,crdb-7
      --locality=region=us-east,zone=us-east-1
    ports:
      - "26257:26257"
      - "8080:8080"
    volumes:
      - crdb-multi-1:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      bench-net:
      region-us-east:
    cap_add:
      - NET_ADMIN

  crdb-2:
    image: cockroachdb/cockroach:latest-v26.3
    command: >
      start --insecure
      --advertise-addr=crdb-2
      --join=crdb-1,crdb-4,crdb-7
      --locality=region=us-east,zone=us-east-2
    ports:
      - "26258:26257"
      - "8081:8080"
    volumes:
      - crdb-multi-2:/cockroach/cockroach-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 5s
