  crdb-8:
    image: cockroachdb/cockroach:latest-v26.3
    command: >
      start --insecure
      --advertise-addr=crdb-8
      --join=crdb-1,crdb-4,crdb-7
      --locality=region=eu-west,zone=eu-west-2
    ports:
